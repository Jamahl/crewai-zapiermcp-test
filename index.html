<!doctype html>
<html lang="en" data-theme="retro">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CrewAI Chat Assistant</title>
  </head>
  <body>
<div class="drawer lg:drawer-open h-screen">
      <input id="my-drawer-2" type="checkbox" class="drawer-toggle" />
  <div class="drawer-content flex flex-col">
    <div id="app" class="flex-1 flex flex-col"></div>
    <label for="my-drawer-2" class="btn btn-primary drawer-button lg:hidden fixed bottom-4 right-4 z-10">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" /></svg>
    </label>
  </div>
      <div class="drawer-side">
    <label for="my-drawer-2" aria-label="close sidebar" class="drawer-overlay"></label>
        <ul class="menu p-4 w-80 min-h-full bg-base-200 text-base-content">
          <!-- Sidebar content here -->
        </ul>
    <dialog id="admin-modal" class="modal">
      <div class="modal-box">
        <h3 class="font-bold text-lg">Admin Configuration <span class="badge badge-primary">New</span></h3>
        <p class="py-4">This is a placeholder for the admin configuration. You can add your settings here.</p>
        <h4 class="font-bold">Heading 1 <span class="badge badge-secondary">Beta</span></h4>
        <p>Some content for heading 1.</p>
        <h4 class="font-bold">Heading 2 <span class="badge badge-accent">Experimental</span></h4>
        <p>Some content for heading 2.</p>
        <div class="modal-action">
          <form method="dialog">
            <button class="btn">Close</button>
          </form>
        </div>
      </div>
    </dialog>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
